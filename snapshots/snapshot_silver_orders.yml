snapshots:
  - name: silver_orders_snapshot
    description: >
      Snapshot of silver order-level metrics to track historical changes in
      order status, valid order date, and lifetime value per customer and order.

    config:
      target_schema: snapshots
      strategy: check
      unique_key: "concat(customer_id, '-', order_id)"
      check_cols:
        - order_status
        - valid_order_date
        - lifetime_value
      hard_deletes: ignore
      dbt_valid_to_current: "to_date('9999-12-31')"
