name: CI Pipeline

on:
  push:
    branches:
      - dev
      - uat
      - prd
  pull_request:
    branches:
      - dev
      - uat
      - prd
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

  deploy:
    name: Deploy
    needs: build-and-test
    runs-on: ubuntu-latest

    # Environment is selected from branch name: dev / uat / prd
    environment: ${{ github.ref_name }}

    # Deploy only on push (not on PRs)
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "ENV_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "API_URL=${{ vars.API_URL }}" >> $GITHUB_ENV

      - name: Deploy application
        run: |
          echo "Deploying to $ENV_NAME"
          echo "Using API URL: $API_URL"
          # ./deploy.sh $ENV_NAME

