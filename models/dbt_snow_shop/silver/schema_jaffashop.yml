version: 2

models:
  - name: silver_jaffashop_customers
    description: "Customer dimension table with order aggregation metrics."

    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        tests:
          - not_null
          - unique

      - name: first_name
        description: "Customer first name."

      - name: last_name
        description: "Customer last name."

      - name: full_name
        description: "Concatenation of first and last name."

      - name: first_order_date
        description: "Date of the customer’s first order."

      - name: most_recent_order_date
        description: "Date of the customer’s most recent order."

      - name: number_of_orders
        description: "Total number of orders placed by the customer."
        
  - name: silver_jaffashop_orders_customer
    description: "Fact table containing customer order lifetime value."

    columns:
      - name: order_id
        description: "Unique identifier for each order."
        tests:
          - not_null

      - name: customer_id
        description: "Identifier of the customer who placed the order."
        tests:
          - not_null

      - name: lifetime_value
        description: "Total successful payment amount per order."

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - customer_id
              - order_id
