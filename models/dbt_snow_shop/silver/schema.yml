version: 2

models:
  - name: dbt_snow_shop
    schema: silver
    tables:

      - name: silver_customers
        description: "Customer dimension table with order aggregation metrics."
        tags: ['jaffa_shop']
        columns:
          - name: customer_id
            description: "Unique identifier for each customer."
            tests:
              - not_null
              - unique

          - name: first_name
            description: "Customer first name."

          - name: last_name
            description: "Customer last name."

          - name: full_name
            description: "Concatenation of first and last name."

          - name: first_order_date
            description: "Date of the customer’s first order."

          - name: most_recent_order_date
            description: "Date of the customer’s most recent order."

          - name: number_of_orders
            description: "Total number of orders placed by the customer."


      - name: silver_orders
        description: "Fact table containing customer order lifetime value."
        tags: ['jaffa_shop']
        columns:
          - name: order_id
            description: "Unique identifier for each order."
            tests:
              - not_null

          - name: customer_id
            description: "Identifier of the customer who placed the order."
            tests:
              - not_null

          - name: lifetime_value
            description: "Total successful payment amount per order."

        tests:
          - unique:
              column_name: "customer_id || '-' || order_id"