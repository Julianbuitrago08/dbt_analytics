models:
  - name: gold_fct_orders
    description: >
      Fact table containing order-level revenue metrics. Each row represents
      an order with its associated customer and lifetime value.
    columns:
      - name: order_id
        description: Unique identifier for the order.
        tests:
          - not_null
          - unique

      - name: customer_id
        description: Unique identifier for the customer who placed the order.
        tests:
          - not_null

      - name: lifetime_value
        description: Total revenue associated with the order.

  - name: gold_dim_customers
    description: >
      Customer dimension table enriched with order history and aggregated
      lifetime value. One row per customer.
    columns:
      - name: customer_id
        description: Unique identifier for the customer.
        tests:
          - not_null
          - unique

      - name: first_name
        description: Customer first name.

      - name: last_name
        description: Customer last name.

      - name: full_name
        description: Full name of the customer.

      - name: first_order_date
        description: Date of the customer’s first order.

      - name: most_recent_order_date
        description: Date of the customer’s most recent order.

      - name: number_of_orders
        description: Total number of orders placed by the customer.

      - name: lifetime_value
        description: Total lifetime revenue generated by the customer.
exposures:
  - name: orders_data
    label: Orders Data
    type: notebook
    maturity: high
    url: https://tinyurl.com/jaffle-shop-reporting
    description: >
      Notebook used for reporting and analysis of order-level metrics derived
      from the gold layer.
    depends_on:
      - ref('gold_fct_orders')
    owner:
      name: Julian Buitrago
      email: data@jaffleshop.com