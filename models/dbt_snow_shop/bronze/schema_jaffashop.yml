version: 2

sources:
  - name: dbt_snow_shop
    schema: bronze
    tables:
      - name: bronze_customers
        description: "Raw customers CSV loaded into Snowflake."

      - name: bronze_orders
        description: "Raw orders data loaded externally"
      - name: bronze_payments
        description: "Raw Stripe payments CSV loaded into Snowflake."

models:

  - name: bronze_jaffashop_customers
    description: "Raw customers data loaded from a CSV file in a Snowflake stage."
    columns:
      - name: id
        description: "Primary key for customers."
        data_tests:
          - unique
          - not_null

      - name: first_name
        description: "Customer first name."

      - name: last_name
        description: "Customer last name."

      - name: source_file_name
        description: "Name of the source file from which the record was loaded."

      - name: file_last_modified_ts
        description: "Timestamp when the source file was last modified."

      - name: load_timestamp
        description: "Timestamp when the record was loaded into Snowflake."

  - name: bronze_jaffashop_orders
    description: "Raw orders data loaded from a CSV file in a Snowflake stage."
    columns:
      - name: id
        description: "Primary key for orders."
        data_tests:
          - unique
          - not_null

      - name: user_id
        description: "Identifier of the customer who placed the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                field: id
                to: ref('bronze_customers')


      - name: order_date
        description: "Date when the order was placed."

      - name: status
        description: "{{ doc('order_status') }}" 
        data_tests:
        - accepted_values:
            arguments:
              values: ['completed', 'shipped', 'placed','return_pending','returned']

      - name: source_file_name
        description: "Name of the source file from which the record was loaded."

      - name: file_last_modified_ts
        description: "Timestamp when the source file was last modified."

      - name: load_timestamp
        description: "Timestamp when the record was loaded into Snowflake."
  - name: bronze_jaffashop_payment
    description: "Raw Stripe payment data loaded from a CSV file in a Snowflake stage."
    columns:
      - name: id
        description: "Primary key for payments."
        data_tests:
          - unique
          - not_null

      - name: orderid
        description: "Identifier of the related order."
        data_tests:
          - not_null

      - name: paymentmethod
        description: "Payment method used (e.g. card, bank transfer)."

      - name: payment_status
        description: "Current status of the payment."

      - name: amount
        description: "Payment amount."

      - name: created
        description: "Timestamp when the payment was created."

      - name: source_file_name
        description: "Name of the source file from which the record was loaded."

      - name: file_last_modified_ts
        description: "Timestamp when the source file was last modified."

      - name: load_timestamp
        description: "Timestamp when the record was loaded into Snowflake."
